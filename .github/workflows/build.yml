name: build

# Every push to main builds Etykiety.exe and publishes it as a new GitHub release
# (tag v<VERSION_PREFIX>.<run number>). The newest one is always available at
# releases/latest/download/Etykiety.exe.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION_PREFIX: '0.1'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Version
        id: version
        shell: bash
        run: echo "version=${VERSION_PREFIX}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Test
        run: dotnet test tests/LabelPrinter.Core.Tests/LabelPrinter.Core.Tests.csproj -c Release

      - name: Publish single-file exe
        run: >
          dotnet publish src/LabelPrinter.Desktop/LabelPrinter.Desktop.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:Version=${{ steps.version.outputs.version }}
          -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: Etykiety-win-x64
          path: publish/Etykiety.exe
          if-no-files-found: error

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Etykiety ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Commit: ${{ github.sha }}

            ${{ github.event.head_commit.message }}
          files: publish/Etykiety.exe
