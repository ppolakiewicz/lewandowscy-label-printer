name: build

# Builds Etykiety.exe and publishes it as a GitHub release for every v* tag.
# Forgejo tags each commit on main (.forgejo/workflows/tag.yml) and the push
# mirror brings the tag here. The newest exe is always at
# releases/latest/download/Etykiety.exe.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Version
        id: version
        shell: bash
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          {
            echo 'notes<<EOF_NOTES'
            git log -1 --format=%B
            echo 'EOF_NOTES'
          } >> "$GITHUB_OUTPUT"

      - name: Test
        run: dotnet test tests/LabelPrinter.Core.Tests/LabelPrinter.Core.Tests.csproj -c Release

      - name: Publish single-file exe
        run: >
          dotnet publish src/LabelPrinter.Desktop/LabelPrinter.Desktop.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:Version=${{ steps.version.outputs.version }}
          -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: Etykiety-win-x64
          path: publish/Etykiety.exe
          if-no-files-found: error

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Etykiety ${{ steps.version.outputs.version }}
          make_latest: true
          body: |
            Commit: ${{ github.sha }}

            ${{ steps.version.outputs.notes }}
          files: publish/Etykiety.exe
