name: build

# The only place the project is built. Every v* tag gets a GitHub release with
# Etykiety.exe; the newest one is always at releases/latest/download/Etykiety.exe.
# Tags are created on commit by .githooks/post-commit and arrive through the
# Forgejo push mirror (tags made here on GitHub would be deleted by the mirror).
# Pushes to other branches (and manual runs) only test and build the exe as an
# artifact, without a release; main itself is built through its tags.

on:
  push:
    tags: ['v*']
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi
          {
            echo 'notes<<EOF_NOTES'
            git log -1 --format=%B
            echo 'EOF_NOTES'
          } >> "$GITHUB_OUTPUT"

      - name: Test
        run: dotnet test tests/LabelPrinter.Core.Tests/LabelPrinter.Core.Tests.csproj -c Release

      - name: Publish single-file exe
        run: >
          dotnet publish src/LabelPrinter.Desktop/LabelPrinter.Desktop.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:Version=${{ steps.version.outputs.version }}
          -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: Etykiety-win-x64
          path: publish/Etykiety.exe
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Etykiety ${{ steps.version.outputs.version }}
          make_latest: true
          body: |
            Commit: ${{ github.sha }}

            ${{ steps.version.outputs.notes }}
          files: publish/Etykiety.exe
